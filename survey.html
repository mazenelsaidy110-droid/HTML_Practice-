<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">Title</h1>
    <p id="description">Description</p>
    <form id="survey-form">
      <label for="name" id="name-label">Name</label>
      <input id="name" type="text" required placeholder="Mazen_Elsaidy" /><br />
      <label for="email" id="email-label">Email</label>
      <input id="email" required type="email" placeholder=".com" /><br />
      <label for="number" id="number-label">Number</label>
      <input
        id="number"
        type="number"
        required
        min="3"
        max="11"
        placeholder="010"
      /><br />
      <label for="dropdown">Country</label>
      <select id="dropdown">
        <option selected>Egypt</option>
        <option>e.g.</option></select
      ><br />
      <fieldset>
        <legend>Are you employment ?</legend>
        <input type="radio" name="employment" id="yes" value="no" />
        <label for="yes">Yes</label>
        <input type="radio" name="employment" id="no" value="no" />
        <label for="no">No</label>
      </fieldset>
      <fieldset>
        <legend>Languages</legend>
        <input type="checkbox" id="en" value="en" />
        <label for="en">English</label>
        <input type="checkbox" id="ar" value="ar" />
        <label for="ar">Arabic</label>
        <input type="checkbox" id="sp" value="sp" />
        <label for="sp">Spanish</label>
      </fieldset>
      <textarea cols="50" rows="15"> </textarea>
      <button type="submit" id="submit">Submit</button>
    </form>
  </body>
</html>
