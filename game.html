<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Audio and Video Lab</title>
  </head>
  <body>
    <h1>the main title of the page</h1>
    <section>
      <h2>"the title of the video playing"</h2>
      <video controls width="640">
        <source src="trailer.mp4" type="video/mp4" />
      </video>
    </section>
    <section>
      <h2>the title of the song playing</h2>
      <audio controls loop src="bgm.mp3"></audio>
    </section>
  </body>
</html>
